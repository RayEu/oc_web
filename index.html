<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCode Session Viewer</title>
<style>
  :root, [data-theme="light"] {
    --bg-primary: #ffffff;
    --bg-secondary: #f8f8f8;
    --bg-tertiary: #f0f0f0;
    --bg-hover: #e8e8e8;
    --bg-active: #d8d8d8;
    --border: #d0d0d0;
    --text-primary: #1a1a1a;
    --text-secondary: #666666;
    --text-muted: #999999;
    --accent: #2563eb;
    --accent-dim: #dbeafe;
    --green: #16a34a;
    --yellow: #ca8a04;
    --red: #dc2626;
    --purple: #9333ea;
    --orange: #ea580c;
    --scrollbar-bg: #e8e8e8;
    --scrollbar-thumb: #c0c0c0;
    --code-bg: #f5f5f5;
    --thinking-bg: #ede9fe;
    --tool-bg: #f0fdf4;
    --delete-hover: rgba(239,68,68,0.08);
  }
  [data-theme="dark"] {
    --bg-primary: #0a0a0a;
    --bg-secondary: #111111;
    --bg-tertiary: #1a1a1a;
    --bg-hover: #222222;
    --bg-active: #2a2a2a;
    --border: #2a2a2a;
    --text-primary: #e5e5e5;
    --text-secondary: #888888;
    --text-muted: #555555;
    --accent: #4a9eff;
    --accent-dim: #1a3a5c;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --purple: #a855f7;
    --orange: #f97316;
    --scrollbar-bg: #1a1a1a;
    --scrollbar-thumb: #333333;
    --code-bg: #0d1117;
    --thinking-bg: #1a1a2e;
    --tool-bg: #0f1a12;
    --delete-hover: rgba(239,68,68,0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    font-size: 13px;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--scrollbar-bg); }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }

  /* Left Panel */
  #left-panel {
    width: 320px;
    min-width: 240px;
    max-width: 480px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    flex-shrink: 0;
    position: relative;
  }
  #resize-handle {
    position: absolute;
    right: -3px;
    top: 0;
    width: 6px;
    height: 100%;
    cursor: col-resize;
    z-index: 10;
  }
  #resize-handle:hover, #resize-handle.active {
    background: var(--accent);
    opacity: 0.3;
  }
  #left-header {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #left-header h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    font-weight: 600;
  }
  #search-box {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  #search-box:focus { border-color: var(--accent); }
  #search-box::placeholder { color: var(--text-muted); }
  #session-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .session-item {
    padding: 10px 12px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.1s;
  }
  .session-item:hover { background: var(--bg-hover); }
  .session-item.active {
    background: var(--bg-active);
    border-left-color: var(--accent);
  }
  .session-title {
    font-size: 12px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .session-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .session-id { font-size: 10px; color: var(--text-muted); }
  .session-time { font-size: 10px; color: var(--text-muted); }
  .session-agent {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 500;
  }
  #session-count {
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* Settings */
  #settings-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    margin-left: auto;
    transition: all 0.15s;
    line-height: 1;
  }
  #settings-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
  #refresh-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    transition: all 0.15s;
    line-height: 1;
  }
  #refresh-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  #left-header-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  #left-header-top h2 { margin-bottom: 0; flex: 1; }
  #settings-panel {
    display: none;
    padding: 10px 12px;
    background: var(--bg-tertiary);
    border-radius: 6px;
    margin-bottom: 8px;
    gap: 8px;
    flex-direction: column;
  }
  #settings-panel.open { display: flex; }
  .settings-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .settings-row label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .settings-row input {
    padding: 6px 8px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .settings-row input:focus { border-color: var(--accent); }

  /* New message banner */
  #new-msg-banner {
    display: none;
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    padding: 6px 16px;
    background: var(--accent);
    color: #fff;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  #new-msg-banner:hover { opacity: 0.85; }

  /* Right Panel */
  #right-panel {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 0;
  }
  #right-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    flex-shrink: 0;
  }
  #right-header h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    font-weight: 600;
  }
  #selected-session-title {
    font-size: 14px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #selected-session-info {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  #messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13px;
    flex-direction: column;
    gap: 8px;
  }
  #empty-state .icon { font-size: 48px; opacity: 0.3; }

  /* Message */
  .message {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 75%;
  }
  .message.msg-user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .message.msg-assistant, .message.msg-system {
    align-self: flex-start;
    align-items: flex-start;
  }
  .message-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
  }
  .message-role {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .role-user { color: var(--accent); }
  .role-assistant { color: var(--green); }
  .role-system { color: var(--yellow); }
  .message-model { color: var(--text-muted); }
  .message-time { color: var(--text-muted); margin-left: auto; }

  /* Parts */
  .part { border-radius: 8px; overflow: hidden; }
  .part-text {
    padding: 10px 14px;
    background: var(--bg-tertiary);
    border-radius: 8px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
  }
  .msg-user .part-text {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 2px;
  }
  .msg-assistant .part-text, .msg-system .part-text {
    border-bottom-left-radius: 2px;
  }

  /* Collapsible (thinking & tool) */
  .collapsible-header {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  .collapsible-header .arrow {
    font-size: 10px;
    color: var(--text-muted);
    transition: transform 0.15s;
    flex-shrink: 0;
    width: 12px;
    text-align: center;
  }
  .collapsible-header.open .arrow { transform: rotate(90deg); }
  .collapsible-body { display: none; }
  .collapsible-body.open { display: block; }

  /* Reasoning / Thinking */
  .part-reasoning {
    background: var(--thinking-bg);
    border-left: 3px solid var(--purple);
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    line-height: 1.5;
    color: #b8a8d8;
  }
  .part-reasoning .collapsible-header {
    padding: 8px 12px;
  }
  .part-reasoning .thinking-label {
    color: var(--purple);
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .part-reasoning .collapsible-body {
    padding: 0 12px 10px 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Tool */
  .part-tool {
    padding: 8px 12px;
    background: var(--tool-bg);
    border-left: 3px solid var(--green);
    border-radius: 0 6px 6px 0;
    font-size: 12px;
  }
  .part-tool .collapsible-header { margin-bottom: 0; }
  .part-tool-name {
    color: var(--green);
    font-weight: 600;
    font-size: 11px;
  }
  .part-tool-status {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 500;
  }
  .status-completed { background: rgba(34,197,94,0.15); color: var(--green); }
  .status-running { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .status-pending { background: rgba(136,136,136,0.15); color: var(--text-secondary); }
  .status-error { background: rgba(239,68,68,0.15); color: var(--red); }
  .part-tool-detail { margin-top: 6px; font-size: 11px; }
  .part-tool-input, .part-tool-output {
    padding: 6px 8px;
    background: var(--code-bg);
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-all;
    font-size: 11px;
    line-height: 1.4;
    max-height: 300px;
    overflow-y: auto;
    margin-top: 4px;
    color: var(--text-secondary);
  }
  .part-tool-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }
  .part-step-start, .part-step-finish { display: none; }
  .part-text-part {
    padding: 10px 12px;
    background: var(--bg-tertiary);
    border-radius: 6px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
  }

  /* Input */
  #input-area {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-secondary);
    flex-shrink: 0;
  }
  #input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  #message-input {
    flex: 1;
    padding: 10px 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    resize: none;
    min-height: 40px;
    max-height: 200px;
    line-height: 1.4;
    transition: border-color 0.15s;
  }
  #message-input:focus { border-color: var(--accent); }
  #send-btn {
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
    height: 40px;
  }
  #send-btn:hover { opacity: 0.85; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #send-status { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

  /* Loading */
  .loading {
    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 768px) {
    #left-panel { width: 100%; max-width: none; }
    body { flex-direction: column; }
  }

  /* Theme toggle */
  #theme-toggle {
    position: fixed;
    top: 12px;
    right: 16px;
    z-index: 100;
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-secondary);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  #theme-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }

  /* Session delete button */
  .session-delete {
    opacity: 0;
    border: none;
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 3px;
    transition: all 0.15s;
    flex-shrink: 0;
    line-height: 1;
  }
  .session-item:hover .session-delete { opacity: 1; }
  .session-delete:hover { color: var(--red); background: var(--delete-hover); }
  .session-title-row {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 4px;
  }
  .session-title-row .session-title { flex: 1; min-width: 0; }
</style>
</head>
<body>

<button id="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light theme">&#9789;</button>

<div id="left-panel">
  <div id="resize-handle"></div>
  <div id="left-header">
    <div id="left-header-top">
      <h2>Sessions</h2>
      <button id="refresh-btn" onclick="loadSessions()" title="Refresh sessions">&#8635;</button>
      <button id="settings-toggle" onclick="toggleSettings()" title="Settings">&#9881;</button>
    </div>
    <div id="settings-panel">
      <div class="settings-row">
        <label>OpenCode URL</label>
        <input id="setting-url" type="text" value="http://127.0.0.1:4096" spellcheck="false">
      </div>
      <div class="settings-row">
        <label>Poll Interval (ms)</label>
        <input id="setting-poll" type="number" value="10000" min="500" step="500">
      </div>
    </div>
    <input id="search-box" type="text" placeholder="Search by session ID..." autocomplete="off" spellcheck="false">
  </div>
  <div id="session-list">
    <div class="loading"><span class="spinner"></span> Loading sessions...</div>
  </div>
  <div id="session-count"></div>
</div>

<div id="right-panel">
  <div id="right-header">
    <h2>Conversation</h2>
    <div id="selected-session-title"></div>
    <div id="selected-session-info"></div>
  </div>
  <div id="messages-container">
    <div id="empty-state">
      <div class="icon">&#9776;</div>
      Select a session from the left panel
    </div>
  </div>
  <div id="new-msg-banner" onclick="scrollToBottom()">New messages &#8595;</div>
  <div id="input-area">
    <div id="input-row">
      <textarea id="message-input" placeholder="Send a message..." rows="1" disabled></textarea>
      <button id="send-btn" disabled>Send</button>
    </div>
    <div id="send-status"></div>
  </div>
</div>

<script>
let API = 'http://127.0.0.1:4096';
let pollInterval = 10000;
let sessions = [];
let currentSessionId = null;
let lastMessageCount = 0;

// --- Settings ---
function toggleSettings() {
  document.getElementById('settings-panel').classList.toggle('open');
}

document.getElementById('setting-url').addEventListener('change', e => {
  const v = e.target.value.trim().replace(/\/+$/, '');
  if (v) API = v;
});

document.getElementById('setting-poll').addEventListener('change', e => {
  const v = parseInt(e.target.value, 10);
  if (v >= 500) {
    pollInterval = v;
    startPolling();
  }
});

// --- Resizable left panel ---
const leftPanel = document.getElementById('left-panel');
const resizeHandle = document.getElementById('resize-handle');
let isResizing = false;

resizeHandle.addEventListener('mousedown', e => {
  isResizing = true;
  resizeHandle.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!isResizing) return;
  leftPanel.style.width = Math.max(200, Math.min(600, e.clientX)) + 'px';
});
document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false;
    resizeHandle.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});

// --- API helpers ---
async function apiFetch(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
async function apiPost(path, body) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  try {
    const res = await fetch(API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl.signal,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    return text ? JSON.parse(text) : {};
  } finally {
    clearTimeout(timer);
  }
}

// --- Session list (v2 API) ---
async function loadSessions() {
  const el = document.getElementById('session-list');
  el.innerHTML = '<div class="loading"><span class="spinner"></span> Loading...</div>';
  try {
    const resp = await apiFetch('/api/session');
    sessions = resp.data || [];
    renderSessions(sessions);
  } catch (e) {
    el.innerHTML = `<div class="loading" style="color:var(--red)">Failed to load: ${e.message}<br><small>Make sure opencode serve is running</small></div>`;
  }
}

function renderSessions(list) {
  const el = document.getElementById('session-list');
  const countEl = document.getElementById('session-count');
  if (!list.length) {
    el.innerHTML = '<div class="loading" style="color:var(--text-muted)">No sessions found</div>';
    countEl.textContent = '';
    return;
  }
  el.innerHTML = list.map(s => {
    const time = s.time?.created ? formatTime(s.time.created) : '';
    const active = s.id === currentSessionId ? ' active' : '';
    return `<div class="session-item${active}" data-id="${s.id}" onclick="selectSession('${s.id}')">
      <div class="session-title-row">
        <span class="session-title">${esc(s.title || 'Untitled')}</span>
        <button class="session-delete" onclick="event.stopPropagation();deleteSession('${s.id}')" title="Delete session">&times;</button>
      </div>
      <div class="session-meta">
        <span class="session-id">${s.id.slice(0, 16)}...</span>
        <span class="session-agent">${esc(s.agent || 'default')}</span>
        <span class="session-time">${time}</span>
      </div>
    </div>`;
  }).join('');
  countEl.textContent = `${list.length} session${list.length !== 1 ? 's' : ''}`;
}

function formatTime(ms) {
  const diff = Date.now() - ms;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  return new Date(ms).toLocaleDateString() + ' ' + new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function formatTs(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// --- Search ---
document.getElementById('search-box').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  renderSessions(q ? sessions.filter(s => s.id.toLowerCase().includes(q)) : sessions);
});

// --- Select session ---
async function selectSession(id) {
  currentSessionId = id;
  const session = sessions.find(s => s.id === id);
  document.querySelectorAll('.session-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));

  document.getElementById('selected-session-title').textContent = session?.title || 'Untitled';
  const model = session?.model;
  const info = [
    session?.id,
    model ? `${model.providerID}/${model.id || model.modelID}` : '',
    session?.tokens ? `${session.tokens.input} in / ${session.tokens.output} out` : '',
  ].filter(Boolean).join('  ·  ');
  document.getElementById('selected-session-info').textContent = info;

  document.getElementById('message-input').disabled = false;
  document.getElementById('send-btn').disabled = false;
  hideBanner();
  await loadMessages(id);
}

// --- Messages (legacy API) ---
async function loadMessages(sessionId) {
  const el = document.getElementById('messages-container');
  el.innerHTML = '<div class="loading"><span class="spinner"></span> Loading messages...</div>';
  try {
    const data = await apiFetch(`/session/${sessionId}/message`);
    currentMessages = Array.isArray(data) ? data : (data.data || []);
    lastMessageCount = currentMessages.length;
    renderMessages(currentMessages);
    el.scrollTop = el.scrollHeight;
  } catch (e) {
    el.innerHTML = `<div class="loading" style="color:var(--red)">Failed to load messages: ${e.message}</div>`;
  }
}

let openCollapsibles = new Set();

function renderMessages(messages) {
  const el = document.getElementById('messages-container');
  if (!messages.length) {
    el.innerHTML = '<div id="empty-state"><div class="icon">&#9776;</div>No messages in this session</div>';
    return;
  }
  saveOpenState();
  el.innerHTML = messages.map((msg, mi) => renderMessage(msg, mi)).join('');
  restoreOpenState();
}

function renderMessage(msg, mi) {
  const info = msg.info || msg;
  const parts = msg.parts || [];
  const role = (info.role || 'unknown').toLowerCase();
  const time = info.time?.created ? formatTs(info.time.created) : '';
  const model = info.modelID || '';
  return `<div class="message msg-${role}">
    <div class="message-header">
      <span class="message-role role-${role}">${esc(info.role || role)}</span>
      ${model ? `<span class="message-model">${esc(model)}</span>` : ''}
      <span class="message-time">${time}</span>
    </div>
    ${parts.map((part, pi) => renderPart(part, mi, pi)).join('')}
  </div>`;
}

function renderPart(part, mi, pi) {
  const key = `${mi}_${pi}`;
  switch (part.type) {
    case 'text':
      return `<div class="part part-text">${esc(part.text || '')}</div>`;
    case 'reasoning': {
      return `<div class="part part-reasoning">
        <div class="collapsible-header" data-key="${key}" onclick="toggleCollapsible(this)">
          <span class="arrow">&#9654;</span>
          <span class="thinking-label">Thinking</span>
        </div>
        <div class="collapsible-body" data-key="${key}">${esc(part.text || '')}</div>
      </div>`;
    }
    case 'tool': {
      const state = part.state || {};
      const status = state.status || 'pending';
      const input = state.input || {};
      const output = state.output || '';
      const toolName = part.tool || 'unknown';
      let inputStr = typeof input === 'string' ? input
        : input.command ? input.command
        : input.url ? input.url
        : JSON.stringify(input, null, 2);
      return `<div class="part part-tool">
        <div class="collapsible-header" data-key="${key}" onclick="toggleCollapsible(this)">
          <span class="arrow">&#9654;</span>
          <span class="part-tool-name">[TOOL] ${esc(toolName)}</span>
          <span class="part-tool-status status-${status}">${status}</span>
        </div>
        <div class="collapsible-body" data-key="${key}">
          <div class="part-tool-detail">
            <div class="part-tool-label">Input</div>
            <div class="part-tool-input">${esc(inputStr)}</div>
            ${output ? `<div class="part-tool-label">Output</div><div class="part-tool-output">${esc(typeof output === 'string' ? output.slice(0, 5000) : JSON.stringify(output, null, 2).slice(0, 5000))}</div>` : ''}
          </div>
        </div>
      </div>`;
    }
    case 'step-start':
    case 'step-finish':
      return '';
    default:
      return `<div class="part part-text-part" style="color:var(--text-muted);font-size:11px">[${esc(part.type || 'unknown')}]</div>`;
  }
}

function toggleCollapsible(header) {
  const key = header.dataset.key;
  const body = header.parentElement.querySelector('.collapsible-body');
  if (!header || !body) return;
  header.classList.toggle('open');
  body.classList.toggle('open');
  if (header.classList.contains('open')) {
    openCollapsibles.add(key);
  } else {
    openCollapsibles.delete(key);
  }
}

function saveOpenState() {
  openCollapsibles.clear();
  document.querySelectorAll('.collapsible-header.open').forEach(h => {
    openCollapsibles.add(h.dataset.key);
  });
}

function restoreOpenState() {
  openCollapsibles.forEach(key => {
    const header = document.querySelector(`.collapsible-header[data-key="${key}"]`);
    const body = document.querySelector(`.collapsible-body[data-key="${key}"]`);
    if (header && body) {
      header.classList.add('open');
      body.classList.add('open');
    }
  });
}

// --- Send message ---
const inputEl = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');
const sendStatus = document.getElementById('send-status');

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
});

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !currentSessionId) return;
  sendBtn.disabled = true;
  sendStatus.textContent = 'Sending...';
  inputEl.value = '';
  inputEl.style.height = 'auto';
  try {
    sendStatus.textContent = 'Sending...';
    await apiPost(`/session/${currentSessionId}/message`, { parts: [{ type: 'text', text }] });
    sendStatus.textContent = 'Sent! Waiting for reply...';
    lastMessageCount = 0;
    hideBanner();
    await refreshMessages();
    let retries = 0;
    const waitReply = setInterval(async () => {
      await refreshMessages();
      retries++;
      if (retries > 60 || sendStatus.textContent.includes('Sent!') === false) clearInterval(waitReply);
    }, 2000);
    setTimeout(loadSessions, 3000);
  } catch (e) {
    sendStatus.textContent = `Error: ${e.message}`;
  } finally {
    sendBtn.disabled = false;
  }
}
sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// --- Auto-refresh via polling ---
let pollTimer = null;
let refreshPending = false;

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!currentSessionId) return;
    await refreshMessages();
  }, pollInterval);
}

function refreshMessages() {
  if (refreshPending) return Promise.resolve();
  refreshPending = true;
  return new Promise(async (resolve) => {
    setTimeout(async () => {
      if (!currentSessionId) { refreshPending = false; resolve(); return; }
      const mc = document.getElementById('messages-container');
      const wasAtBottom = mc.scrollHeight - mc.scrollTop - mc.clientHeight < 60;
      const oldCount = lastMessageCount;
      try {
        const data = await apiFetch(`/session/${currentSessionId}/message`);
        const msgs = Array.isArray(data) ? data : (data.data || []);
        lastMessageCount = msgs.length;
        renderMessages(msgs);
        const hasNew = msgs.length > oldCount;
        if (wasAtBottom) {
          mc.scrollTop = mc.scrollHeight;
          hideBanner();
        } else if (hasNew) {
          showBanner(msgs.length - oldCount);
        }
      } catch(e) {}
      refreshPending = false;
      resolve();
    }, 50);
  });
}

function showBanner(count) {
  const b = document.getElementById('new-msg-banner');
  b.textContent = `${count} new message${count > 1 ? 's' : ''} \u2193`;
  b.style.display = 'block';
}
function hideBanner() {
  document.getElementById('new-msg-banner').style.display = 'none';
}
function scrollToBottom() {
  const mc = document.getElementById('messages-container');
  mc.scrollTop = mc.scrollHeight;
  hideBanner();
}

// Hide banner when user scrolls to bottom manually
document.getElementById('messages-container').addEventListener('scroll', function() {
  const mc = this;
  if (mc.scrollHeight - mc.scrollTop - mc.clientHeight < 60) hideBanner();
});

// --- Init ---
loadSessions();
startPolling();

// --- Theme toggle ---
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('oc-theme', next);
  document.getElementById('theme-toggle').innerHTML = next === 'dark' ? '&#9789;' : '&#9788;';
}
// Restore saved theme
(function() {
  const saved = localStorage.getItem('oc-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('theme-toggle').innerHTML = saved === 'dark' ? '&#9789;' : '&#9788;';
})();

// --- Delete session ---
async function deleteSession(id) {
  if (!confirm('Delete this session?')) return;
  try {
    await fetch(API + '/session/' + id, { method: 'DELETE' });
    sessions = sessions.filter(s => s.id !== id);
    if (currentSessionId === id) {
      currentSessionId = null;
      document.getElementById('selected-session-title').textContent = '';
      document.getElementById('selected-session-info').textContent = '';
      document.getElementById('messages-container').innerHTML = '<div id="empty-state"><div class="icon">&#9776;</div>Select a session from the left panel</div>';
      document.getElementById('message-input').disabled = true;
      document.getElementById('send-btn').disabled = true;
    }
    renderSessions(document.getElementById('search-box').value.trim() ? sessions.filter(s => s.id.toLowerCase().includes(document.getElementById('search-box').value.trim().toLowerCase())) : sessions);
  } catch (e) {
    alert('Delete failed: ' + e.message);
  }
}
